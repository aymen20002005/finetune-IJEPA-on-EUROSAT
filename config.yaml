# Configuration for I-JEPA Fine-tuning

# Dataset configuration
dataset:
  name: 'EuroSAT'  # Options: 'EuroSAT'
  data_path: './EuroSAT'
  batch_size: 64
  num_workers: 4
  image_size: 224

# Model configuration (I-JEPA from Hugging Face)
model:
  pretrained_source: 'huggingface'
  pretrained_name: 'ijepa-vith14-1k'  # facebook/ijepa_vith14_1k
  num_classes: 10  # Auto-adjusted based on dataset
  dropout: 0.1

# Training configuration
training:
  mode: 'linear_probe'  # Options: 'linear_probe', 'knn'
  knn_k: 20
  epochs: 20
  warmup_epochs: 5
  base_lr: 1e-3
  weight_decay: 0.05
  save_frequency: 10
  eval_frequency: 5
  checkpoint_path: './checkpoints'
  log_dir: './logs'

# Fine-tuning configuration
finetuning:
  freeze_encoder: True
  unfreeze_after_epochs: null
