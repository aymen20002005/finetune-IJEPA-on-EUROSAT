# Configuration for I-JEPA Fine-tuning

# Dataset configuration
dataset:
  name: 'MNIST'  # Options: 'MNIST', 'CIFAR10', 'CIFAR100'
  data_path: './data'
  batch_size: 64
  num_workers: 4
  image_size: 224

# Model configuration (I-JEPA from Hugging Face)
model:
  pretrained_source: 'huggingface'
  pretrained_name: 'ijepa-vith14-1k'  # facebook/ijepa_vith14_1k
  num_classes: 10  # Auto-adjusted based on dataset
  dropout: 0.1

# Training configuration
training:
  epochs: 50
  warmup_epochs: 5
  base_lr: 2e-4
  weight_decay: 0.05
  save_frequency: 10
  eval_frequency: 5
  checkpoint_path: './checkpoints'
  log_dir: './logs'

# Fine-tuning configuration
finetuning:
  freeze_encoder: False  # True = Linear probe, False = Full fine-tuning
  unfreeze_after_epochs: null  # Optional: unfreeze after N epochs
